name: FLSNetworkingDemo
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
packages:
  FLSNetworking:
    path: ../..
targets:
  FLSNetworkingDemo:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: FLSNetworking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flsexamples.networking
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FLS Demo
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  FLSNetworkingDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FLSNetworkingDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flsexamples.networking.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FLSNetworkingDemo:
    build:
      targets:
        FLSNetworkingDemo: all
    test:
      targets: [FLSNetworkingDemoUITests]
